services:
  # =========================
  # Main API Application
  # =========================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golang-skeleton
    restart: unless-stopped
    ports:
      - "8080:8080"
    # volumes:
    #   - .:/app
    #   - /app/tmp
    environment:
      - APP_ENV=development 
      - DATABASE_URL=postgres://postgres:postgres@db:5432/golang_skeleton?sslmode=disable
      - REDIS_URL=redis:6379 
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - golang-skeleton-network
    # Remove healthcheck for development to avoid conflicts with hot reloading
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  # =========================
  # PostgreSQL Database
  # =========================
  db:
    image: postgres:16-alpine
    container_name: golang-skeleton-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=golang_skeleton
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - golang-skeleton-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Redis Cache
  # =========================
  redis:
    image: redis:7-alpine
    container_name: golang-skeleton-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - golang-skeleton-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  golang-skeleton-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: